version: 2

models:
  - name: stg_person
    description: "Cleaned patient demographics mapped to OMOP PERSON table"
    columns:
      - name: person_id
        description: "OMOP person_id — primary key"
        tests:
          - not_null
          - unique
      - name: birth_year
        description: "Year of birth — day-level precision stripped for de-identification"
        tests:
          - not_null
      - name: gender_source_value
        description: "Gender from Synthea Patient resource — M, F, or U (unknown)"
        tests:
          - not_null
          - accepted_values:
              values: ['M', 'F', 'U']

  - name: stg_claim_header
    description: >
      Claim-level header data from Synthea EOB resources. Denial flag derived from
      payment=0 on insured claims. CARC attribution applied in mart layer.
    columns:
      - name: claim_id
        description: "Primary key — one row per claim"
        tests:
          - not_null
          - unique
      - name: patient_id
        description: "FK to stg_person.person_id"
        tests:
          - not_null
          - relationships:
              to: ref('stg_person')
              field: person_id
      - name: is_denied
        description: "True when insured claim has payment=0 and submitted>0"
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: denied_amount
        description: "Dollar amount denied — 0 for paid claims, submitted_amount for denied claims"
        tests:
          - not_null

  - name: stg_claim_line
    description: >
      Line-level claim detail from Synthea EOB. One row per procedure line per claim.
      Denial flag derived from payment=0 with submitted>0.
    columns:
      - name: claim_line_id
        description: "Primary key — one row per claim line"
        tests:
          - not_null
          - unique
      - name: claim_id
        description: "FK to stg_claim_header.claim_id"
        tests:
          - not_null
          - relationships:
              to: ref('stg_claim_header')
              field: claim_id
      - name: sequence
        description: "Line item sequence number within the claim"
        tests:
          - not_null
      - name: procedure_code
        description: "CPT/HCPCS procedure code from EOB.item[].productOrService"
      - name: submitted_amount
        description: "Amount billed to payer for this line item"
        tests:
          - not_null
      - name: payment_amount
        description: "Amount paid by payer — 0 on denied lines"
        tests:
          - not_null
      - name: denied_amount
        description: "Difference between submitted and payment amount — 0 on paid lines"
        tests:
          - not_null
      - name: is_denied_line
        description: "True when payment_amount=0 and submitted_amount>0 at line level"
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: stg_visit_occurrence
    description: "Clinical encounters — one row per visit"
    columns:
      - name: visit_occurrence_id
        description: "Primary key — one row per encounter"
        tests:
          - not_null
          - unique
      - name: person_id
        description: "FK to stg_person.person_id"
        tests:
          - not_null
          - relationships:
              to: ref('stg_person')
              field: person_id
      - name: visit_start_datetime
        description: "Encounter start timestamp from Synthea Encounter FHIR resource"

  - name: stg_condition_occurrence
    description: "Diagnosed conditions — one row per condition per encounter"
    columns:
      - name: condition_occurrence_id
        description: "Primary key — one row per diagnosed condition per encounter"
        tests:
          - not_null
          - unique
      - name: person_id
        description: "FK to stg_person.person_id"
        tests:
          - not_null
          - relationships:
              to: ref('stg_person')
              field: person_id
      - name: condition_source_value
        description: "ICD-10-CM or SNOMED code from Synthea Condition FHIR resource"
        tests:
          - not_null
      - name: condition_source_vocabulary
        description: "Code system — ICD10CM or SNOMED"
        tests:
          - not_null
          - accepted_values:
              values: ['ICD10CM', 'SNOMED']

  - name: stg_drug_exposure
    description: "Medication prescriptions — one row per drug per encounter"
    columns:
      - name: drug_exposure_id
        description: "Primary key — one row per prescription per encounter"
        tests:
          - not_null
          - unique
      - name: person_id
        description: "FK to stg_person.person_id"
        tests:
          - not_null
          - relationships:
              to: ref('stg_person')
              field: person_id
      - name: drug_source_value
        description: "RxNorm code from Synthea MedicationRequest FHIR resource"
        tests:
          - not_null
      - name: drug_source_vocabulary
        description: "Code system — RxNorm in all Synthea output"
        tests:
          - not_null

  - name: stg_payer_plan_period
    description: "Insurance coverage periods — one row per coverage period per patient"
    columns:
      - name: payer_plan_period_id
        description: "Primary key — one row per coverage period per patient"
        tests:
          - not_null
          - unique
      - name: person_id
        description: "FK to stg_person.person_id"
        tests:
          - not_null
          - relationships:
              to: ref('stg_person')
              field: person_id
      - name: payer_source_value
        description: "Payer name from Synthea Coverage FHIR resource"
        tests:
          - not_null
      - name: payer_plan_period_start_date
        description: "Coverage start date — used for temporal join with claims"
        tests:
          - not_null
