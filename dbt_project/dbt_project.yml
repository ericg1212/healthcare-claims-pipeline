name: healthcare_claims
version: '1.0.0'
config-version: 2

# Which profile in profiles.yml to use
profile: healthcare_claims

# File paths (relative to this file)
model-paths: ["models"]
test-paths:  ["tests"]
macro-paths: ["macros"]
seed-paths:  ["seeds"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ── Model materialization defaults ──────────────────────────────
# Staging layer: views — cheap, always fresh, no storage cost
# Mart layer:    tables — pre-computed, fast for BI / downstream queries
models:
  healthcare_claims:
    staging:
      +materialized: view
      +schema: staging
    mart:
      +materialized: table
      +schema: mart
