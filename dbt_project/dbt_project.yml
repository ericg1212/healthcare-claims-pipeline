name: healthcare_claims
version: '1.0.0'
config-version: 2
description: "Healthcare claims intelligence pipeline by Eric Grynspan — CARC-level denial classification, RCM analytics, and RWE cohort construction on FHIR R4 data. Snowflake · dbt · Dagster."

# Which profile in profiles.yml to use
profile: healthcare_claims

# File paths (relative to this file)
model-paths: ["models"]
test-paths:  ["tests"]
macro-paths: ["macros"]
seed-paths:  ["seeds"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ── Model materialization defaults ──────────────────────────────
# Staging layer: views — cheap, always fresh, no storage cost
# Mart layer:    tables — pre-computed, fast for BI / downstream queries
models:
  healthcare_claims:
    staging:
      +materialized: view
      +schema: staging
    mart:
      +materialized: table
      +schema: mart

seeds:
  healthcare_claims:
    +schema: mart
    condition_codes:
      +column_types:
        snomed_code: varchar
    denial_rules:
      +column_types:
        carc_code: varchar
        match_procedure: varchar
        match_payer_name: varchar
        match_claim_type: varchar
