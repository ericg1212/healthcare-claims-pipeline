name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install flake8 bandit pip-audit
      - name: flake8
        run: flake8 synthea_parser/ dagster_pipelines/ scripts/ tests/
      - name: bandit
        run: bandit -r synthea_parser/ dagster_pipelines/ -ll
      - name: pip-audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2025-183

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: pytest tests/ -v --cov=synthea_parser --cov=dagster_pipelines

  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Install dbt
        run: pip install dbt-core==1.10.20 dbt-duckdb==1.10.1
      - name: dbt compile (DuckDB)
        run: |
          cd dbt_project
          dbt deps
          dbt compile --profiles-dir profiles
