name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install flake8 bandit pip-audit
      - name: flake8
        run: flake8 synthea_parser/ dagster_pipelines/ scripts/ tests/
      - name: bandit
        run: bandit -r synthea_parser/ dagster_pipelines/ -ll
      - name: pip-audit
        # sqlparse PYSEC-2026-3696..3699/3923: fixed only in 0.6.0, but dbt-core 1.11.x caps
        # sqlparse<0.6.0 (1.12.x lifts it). Dev/CI-only transitive dep; remove on dbt 1.12 bump.
        # certifi PYSEC-2026-4320: fixed in 2026.10.18, but dbt-snowflake 1.11.x requires
        # certifi<2025.4.26. Remove when a dbt-snowflake release lifts that cap.
        # filelock CVE-2026-112907..112913/112915/112935/112936/112938..112940: fixed in 4.x, but
        # snowflake-connector-python requires filelock<4. Remove when the connector allows 4.x.
        run: >-
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2025-183
          --ignore-vuln PYSEC-2026-3696 --ignore-vuln PYSEC-2026-3697
          --ignore-vuln PYSEC-2026-3698 --ignore-vuln PYSEC-2026-3699
          --ignore-vuln PYSEC-2026-3923 --ignore-vuln PYSEC-2026-4320
          --ignore-vuln CVE-2026-112907 --ignore-vuln CVE-2026-112908
          --ignore-vuln CVE-2026-112909 --ignore-vuln CVE-2026-112910
          --ignore-vuln CVE-2026-112911 --ignore-vuln CVE-2026-112912
          --ignore-vuln CVE-2026-112913 --ignore-vuln CVE-2026-112915
          --ignore-vuln CVE-2026-112935 --ignore-vuln CVE-2026-112936
          --ignore-vuln CVE-2026-112938 --ignore-vuln CVE-2026-112939
          --ignore-vuln CVE-2026-112940

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: pytest tests/ -v --cov=synthea_parser --cov=dagster_pipelines

  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Install dbt
        run: pip install dbt-core==1.10.20 dbt-duckdb==1.10.1
      - name: dbt compile (DuckDB)
        run: |
          cd dbt_project
          dbt deps
          dbt compile --profiles-dir profiles
