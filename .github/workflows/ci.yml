name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install flake8 bandit pip-audit
      - name: flake8
        run: flake8 synthea_parser/ dagster_pipelines/ scripts/ tests/
      - name: bandit
        run: bandit -r synthea_parser/ dagster_pipelines/ -ll
      - name: pip-audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2025-183

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: pytest tests/ -v --cov=synthea_parser --cov=dagster_pipelines

  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dbt
        run: pip install dbt-core==1.10.20 dbt-duckdb==1.10.1
      - name: dbt compile (DuckDB)
        run: |
          cd dbt_project
          dbt deps
          dbt compile --profiles-dir profiles
