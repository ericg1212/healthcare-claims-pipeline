name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install flake8 bandit pip-audit
      - name: flake8
        run: flake8 synthea_parser/ dagster_pipelines/ scripts/ tests/
      - name: bandit
        run: bandit -r synthea_parser/ dagster_pipelines/ -ll
      - name: pip-audit
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: pytest tests/ -v --cov=synthea_parser --cov=dagster_pipelines

  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Install dbt
        run: pip install dbt-core==1.10.20 dbt-duckdb==1.10.1
      - name: dbt compile (DuckDB)
        run: |
          cd dbt_project
          dbt deps
          dbt compile --profiles-dir profiles
